# Builds a signed APK and publishes it as a GitHub Release.
# Run it by pushing a tag (git tag v1.1 && git push origin v1.1) or from the Actions tab.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64  base64 of the release .jks (base64 -i japan27-release.jks | pbcopy)
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias (japan27)
#   SIGNING_KEY_PASSWORD     key password
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.1 (tag v1.1 is created)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing. Updates only install over an APK signed with the same key."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          # run_number only goes up, so every build installs over the last one.
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk japan27-tv.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES="Japan27 for Fire TV ${{ steps.ver.outputs.name }} (build ${{ github.run_number }}). In Downloader, open https://github.com/${{ github.repository }}/releases/latest/download/japan27-tv.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" japan27-tv.apk --clobber
          else
            gh release create "$TAG" japan27-tv.apk --title "Japan27 TV $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
